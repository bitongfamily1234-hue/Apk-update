name: Texture regression tests

on:
  push:
    paths:
      - "apk_analysis/**"
      - "tests/**"
      - ".github/workflows/texture-regression.yml"
  pull_request:
    paths:
      - "apk_analysis/**"
      - "tests/**"
      - ".github/workflows/texture-regression.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pillow
      - name: Run texture regression suite
        run: python -m pytest -q tests
